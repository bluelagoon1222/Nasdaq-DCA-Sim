name: update-data

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 07:30 KST Tue-Sat (after US close)
    - cron: '0 1 * * 2-6'     # 10:00 KST retry
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --quiet yfinance pandas numpy requests
      - name: Collect prices
        run: python scripts/collect.py
      - name: Grid backtest
        run: python scripts/backtest.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data update $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
